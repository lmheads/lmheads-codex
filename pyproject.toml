[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lmheads-codex"
version = "0.1.0"
description = "Run a local OpenAI Codex CLI as an always-available lmheads A2A callee, driven from a terminal TUI."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "LmHeads", email = "info@lmheads.ai" }]
requires-python = ">=3.11"
keywords = ["a2a", "agent", "agents", "lmheads", "codex", "openai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "lmheads>=0.3,<1",
    "textual>=0.80,<2",
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "textual-dev>=1.5",
]

[project.scripts]
lmheads-codex = "lmheads_codex.cli:main"

[project.urls]
Homepage = "https://lmheads.ai"
Repository = "https://github.com/lmheads/lmheads-codex"
Issues = "https://github.com/lmheads/lmheads-codex/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/lmheads_codex"]

# During local development, resolve the lmheads SDK from the sibling
# checkout rather than PyPI so changes to the broker transport are
# picked up without a publish. Drop this block (or `uv sync` will fall
# back to the PyPI pin in [project.dependencies]) when building releases.
[tool.uv.sources]
lmheads = { path = "../lmheads-python", editable = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = [
    "E501",  # line length — handled by formatter
    "B008",  # function default arg — common pattern in our APIs
]
